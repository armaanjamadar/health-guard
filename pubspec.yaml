name: health_guard
description: "Preventive healthcare through technology."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_screen.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_screen.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
